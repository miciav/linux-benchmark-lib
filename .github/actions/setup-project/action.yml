name: Set up the project
description: >-
  Python, uv with its download cache, and (optionally) the locked environment.
  One definition for every job, so the toolchain cannot differ between them.

inputs:
  python-version:
    description: Python version to install.
    default: "3.12"
  sync:
    description: Whether to install the locked environment with all extras.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install the locked environment
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --frozen --all-extras
