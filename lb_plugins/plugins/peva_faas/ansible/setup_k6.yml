---
# Standalone playbook to install k6 load testing tool.
# Can be run independently or used as reference.
# For orchestrated setup, use setup_plugin.yml instead.

- name: Install k6 and prepare workspace
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars/k6.yml
  tasks:
    - name: Install k6
      ansible.builtin.import_tasks: tasks/install_k6.yml
    - name: Create a private staging directory for the openfaas installer
      ansible.builtin.tempfile:
        state: directory
        prefix: lb-install-openfaas-
      register: openfaas_staging

    - name: Download the OpenFaaS CLI installer
      ansible.builtin.get_url:
        url: https://cli.openfaas.com
        dest: "{{ openfaas_staging.path }}/install-openfaas-cli.sh"
        mode: "0700"
        force: true

    - name: Install faas-cli
      ansible.builtin.command:
        cmd: "{{ openfaas_staging.path }}/install-openfaas-cli.sh"
      args:
        creates: "/usr/local/bin/faas-cli"

    - name: Remove the openfaas staging directory
      ansible.builtin.file:
        path: "{{ openfaas_staging.path }}"
        state: absent
